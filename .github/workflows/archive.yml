name: "Archive Issues and Pull Requests"

on:
  schedule:
    - cron: '0 0 * * 0,2,4'
  repository_dispatch:
    types: [archive]
  workflow_dispatch:
    inputs:
      archive_full:
        description: 'Recreate the archive from scratch'
        default: false
        type: boolean

jobs:
  build:
    name: "Archive Issues and Pull Requests"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
    - name: "Checkout"
      uses: actions/checkout@v6

    - name: "Configure Git Identity"
      # i-d-template commits as "ID Bot" unless a global git identity exists; provide github-actions[bot] instead
      run: |
        git config --file .git/ci-gitconfig user.name "github-actions[bot]"
        git config --file .git/ci-gitconfig user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --file .git/ci-gitconfig --add safe.directory "*"

    # Note: No caching for this build!

    - name: "Update Archive"
      uses: martinthomson/i-d-template@v1
      env:
        GIT_CONFIG_GLOBAL: /github/workspace/.git/ci-gitconfig
        ARCHIVE_FULL: ${{ inputs.archive_full }}
      with:
        make: archive
        token: ${{ github.token }}

    - name: "Update GitHub Pages"
      uses: martinthomson/i-d-template@v1
      env:
        GIT_CONFIG_GLOBAL: /github/workspace/.git/ci-gitconfig
      with:
        make: gh-archive
        token: ${{ github.token }}

    - name: "Save Archive"
      uses: actions/upload-artifact@v6
      with:
        name: archive
        path: archive.json
